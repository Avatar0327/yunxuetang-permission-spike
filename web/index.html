<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>云学堂 · 权限预研</title><link rel="stylesheet" href="/assets/element.css"><style>body{margin:0;background:#f4f6fa;color:#18243b;font:15px system-ui}header{padding:24px 40px;background:white;border-bottom:1px solid #e4e8ef}main{max-width:1050px;margin:36px auto}.box{padding:28px;background:white;border-radius:12px;margin:20px 0}h1{font-size:26px}small{color:#66758a}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}nav{display:flex;gap:12px;flex-wrap:wrap}</style>
<div id="app"><header>云学堂 <small>权限预研 · 合成数据</small></header><main>
<h1>{{caps.backend&&!learner?'管理后台':'学习中心'}}</h1>
<div class="controls"><el-select v-model="actor" @change="refresh" style="width:200px"><el-option v-for="id in ['L','M','X','Y','Z']" :label="'测试身份 '+id" :value="id"/></el-select><el-button @click="refresh">刷新权限</el-button><el-button @click="go('/learn')">返回学员端</el-button><el-button v-if="caps.backend" @click="go('/')">管理首页</el-button></div>
<nav class="box" v-if="caps.backend&&!learner"><el-button v-for="n in caps.nodes" :key="n" @click="go(n==='project'?'/projects':'/module/'+n)">{{labels[n]||'业务管理'}}</el-button></nav>
<div class="box controls"><span>项目直达</span><el-input aria-label="项目编号" v-model="projectId" style="width:160px"/><el-button @click="go('/projects/'+encodeURIComponent(projectId))">打开项目</el-button></div>
<div v-if="error" class="box"><el-result icon="warning" title="暂时无法访问" :sub-title="error"><template #extra><el-button @click="refresh">重试</el-button><el-button @click="go('/learn')">返回学员端</el-button></template></el-result></div>
<div v-else-if="learner||!caps.backend" class="box"><el-empty description="当前没有管理任务，你可以继续学习。"/></div>
<template v-else><div class="box" v-if="view==='projects'||view==='home'&&caps.nodes.includes('project')"><h2>培训中心</h2><el-empty v-if="!projects.length" description="当前没有可管理的项目"/><el-table v-else :data="projects"><el-table-column prop="title" label="项目"/><el-table-column label="操作"><template #default="s"><el-button @click="go('/projects/'+encodeURIComponent(s.row.id))">查看</el-button></template></el-table-column></el-table></div>
<div class="box" v-if="detail"><h2>{{detail.title}}</h2><p>已获得此项目的访问权限。</p><el-button @click="go('/projects')">返回项目列表</el-button></div>
<div class="box" v-if="view==='module'"><h2>{{moduleTitle}}</h2><p>当前可见记录：{{moduleCount}}</p><el-empty v-if="!moduleCount" description="当前没有可见记录"/></div></template>
</main></div><script src="/assets/vue.js"></script><script src="/assets/element.js"></script><script>
Vue.createApp({data:()=>({actor:sessionStorage.getItem('spikeActor')||'L',caps:{backend:false,nodes:[]},projects:[],error:'',detail:null,learner:false,view:'home',projectId:'P',moduleTitle:'',moduleCount:0,sequence:0,labels:{project:'培训中心','personal-learning':'个人学习报表','department-report':'部门学习报表',history:'历史学习报表',course:'知识中心',category:'知识分类', 'role-management':'角色管理',account:'账户管理',department:'组织部门',administration:'权限管理','team-enrollment':'团队报名','face-to-face':'面授管理'}}),methods:{
async api(path){const r=await fetch(path,{headers:{Authorization:'Bearer spike-'+this.actor}});const x=await r.json();if(!r.ok)throw Error(r.status===503?'服务暂不可用，请稍后重试':'你暂时不能查看或操作这项内容，请联系管理员确认权限');return x;},
go(path){if(location.hash==='#'+path)this.refresh();else location.hash=path;},
async refresh(){const sequence=++this.sequence;sessionStorage.setItem('spikeActor',this.actor);this.error='';this.projects=[];this.detail=null;this.moduleCount=0;this.learner=false;try{
 const caps=(await this.api('/auth/me')).capabilities;if(sequence!==this.sequence)return;this.caps=caps;const path=decodeURIComponent(location.hash.slice(1)||'/');
 if(path==='/learn'){this.learner=true;return;}
 if(path.startsWith('/projects/')){this.view='detail';const result=await this.api('/projects/'+encodeURIComponent(path.slice(10)));if(sequence===this.sequence)this.detail=result.rows[0];return;}
 if(path.startsWith('/module/')){const node=path.slice(8);this.view='module';this.moduleTitle=this.labels[node]||'业务管理';const endpoints={'personal-learning':'/report','department-report':'/report?node=department-report',history:'/history',course:'/courses',account:'/account/entries','face-to-face':'/face-to-face'};if(!caps.nodes.includes(node))throw Error('你暂时不能查看或操作这项内容，请联系管理员确认权限');if(endpoints[node]){const result=await this.api(endpoints[node]);if(sequence===this.sequence)this.moduleCount=result.count??result.rows?.length??0;}return;}
 if(path!=='/'&&path!=='/projects')throw Error('你暂时不能查看或操作这项内容，请联系管理员确认权限');this.view=path==='/projects'?'projects':'home';if(path==='/projects'||caps.nodes.includes('project')){const result=await this.api('/projects');if(sequence===this.sequence)this.projects=result.rows;}
 }catch(e){if(sequence===this.sequence){this.detail=null;this.projects=[];this.error=e.message;}}}
},mounted(){window.addEventListener('hashchange',()=>this.refresh());this.refresh();}}).use(ElementPlus).mount('#app');
</script></html>
